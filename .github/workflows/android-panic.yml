name: Root Panic APK

on:
  push:
    branches:
      - android-panic
    paths:
      - "android-panic/**"
      - ".github/workflows/android-panic.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the stable-signed APK as a GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROOT_PANIC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROOT_PANIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROOT_PANIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROOT_PANIC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/root-panic-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            {
              echo "ROOT_PANIC_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ROOT_PANIC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ROOT_PANIC_KEY_ALIAS=$KEY_ALIAS"
              echo "ROOT_PANIC_KEY_PASSWORD=$KEY_PASSWORD"
              echo "ROOT_PANIC_STABLE_SIGNING=true"
            } >> "$GITHUB_ENV"
            echo "Stable app signing is enabled."
          else
            echo "ROOT_PANIC_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured. This APK cannot be relied on for in-place updates."
          fi

      - name: Require stable signing for a public release
        if: ${{ inputs.publish_release == true }}
        shell: bash
        run: |
          if [ "$ROOT_PANIC_STABLE_SIGNING" != "true" ]; then
            echo "::error::Configure all four ROOT_PANIC_KEYSTORE_* repository secrets before publishing a release."
            exit 1
          fi

      - name: Build debug APK
        run: gradle -p android-panic clean :app:assembleDebug

      - name: Build stable release APK
        if: env.ROOT_PANIC_STABLE_SIGNING == 'true'
        run: gradle -p android-panic :app:assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          test -s android-panic/app/build/outputs/apk/debug/app-debug.apk
          if [ "$ROOT_PANIC_STABLE_SIGNING" = "true" ]; then
            test -s android-panic/app/build/outputs/apk/release/app-release.apk
            cp android-panic/app/build/outputs/apk/release/app-release.apk Root-Panic-v1.3.apk
          fi
          echo "APK output verification passed."

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## Root Panic build"
            echo "- Version: 1.3 (code 4)"
            if [ "$ROOT_PANIC_STABLE_SIGNING" = "true" ]; then
              echo "- Signature: stable upload key"
              echo "- Update install: compatible with installs signed by this same key"
            else
              echo "- Signature: temporary GitHub runner debug key"
              echo "- Stable Release APK: not built"
              echo "- Configure the four ROOT_PANIC_KEYSTORE_* repository secrets for signed releases"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Root-Panic-v1.3-APKs
          path: |
            android-panic/app/build/outputs/apk/debug/app-debug.apk
            Root-Panic-v1.3.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Collect previous APK builds
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p legacy/v1.0 legacy/v1.1 legacy/v1.2
          gh run download 44920806602 --repo "$GITHUB_REPOSITORY" --name Root-Panic-debug --dir legacy/v1.0
          gh run download 44987827540 --repo "$GITHUB_REPOSITORY" --name Root-Panic-APKs --dir legacy/v1.1
          gh run download 45010540617 --repo "$GITHUB_REPOSITORY" --name Root-Panic-APKs --dir legacy/v1.2
          cp legacy/v1.0/app-debug.apk Root-Panic-v1.0-legacy.apk
          cp legacy/v1.1/debug/app-debug.apk Root-Panic-v1.1-legacy.apk
          cp legacy/v1.2/debug/app-debug.apk Root-Panic-v1.2-legacy.apk

      - name: Publish versioned GitHub Releases
        if: ${{ inputs.publish_release == true && env.ROOT_PANIC_STABLE_SIGNING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_release() {
            tag="$1"
            asset="$2"
            title="$3"
            target="$4"
            notes="$5"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --target "$target"
            fi
          }

          publish_release v1.0 Root-Panic-v1.0-legacy.apk "Root Panic v1.0 (Legacy)" aaae0089e342f720dfe852053a5bf6b613530d2f "Archived Debug APK. Package ID: com.gernelos.apollopanic. Temporary runner signing; not suitable for in-place updates."
          publish_release v1.1 Root-Panic-v1.1-legacy.apk "Root Panic v1.1 (Legacy)" 7966b730ca5a76448405b3ad718a6d7039e84f46 "Archived Debug APK. Package ID: com.gernelos.apollopanic. Temporary runner signing; not suitable for in-place updates."
          publish_release v1.2 Root-Panic-v1.2-legacy.apk "Root Panic v1.2 (Legacy)" ddc343fff6dcf663f00a1ffc8fd482f52ac3c7e2 "Archived Debug APK. Package ID: com.coneui.rootpanic. Temporary runner signing; a clean install is required before moving to the stable-signed release."
          if gh release view v1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.3 Root-Panic-v1.3.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.3 Root-Panic-v1.3.apk --repo "$GITHUB_REPOSITORY" --title "Root Panic v1.3" --notes-file android-panic/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
